workflows:
  android-debug:
    name: Chess Coach Debug APK
    instance_type: linux_x2
    max_build_duration: 30

environment:
      groups:
        - android

scripts:
      - echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - gradle --no-daemon assembleDebug

artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
